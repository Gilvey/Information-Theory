<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 6 — Nash Equilibrium — IT by Gilvey Nikolay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../site.css">
  <style>
    h1 { font-size: 3.5rem; }
    h2 { font-size: 1.35rem; }
  </style>
</head>
<body data-meow="../../meow.mp3">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="../../index.html">IT by Gilvey Nikolay</a>
    <a class="btn btn-outline-light" href="../../index.html">Home</a>
  </div>
</nav>

<main class="container project-page text-center">
  <h1>Project 6</h1>
  <p class="project-note">Nash Equilibrium · Prisoner's Dilemma</p>

  <button id="run" type="button" class="btn btn-primary btn-lg mt-2">Run Simulation</button>

  <div class="row mt-4 text-left">
    <div class="col-md-6 mb-3">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-primary text-white">Decisions</div>
        <div class="card-body" id="decisions"></div>
      </div>
    </div>
    <div class="col-md-6 mb-3">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-success text-white">Betrayal Check</div>
        <div class="card-body" id="betrayal"></div>
      </div>
    </div>
  </div>

  <div class="card shadow-sm">
    <div class="card-header bg-dark text-white">Simulation Result</div>
    <div class="card-body">
      <p id="result" class="result mb-0"></p>
    </div>
  </div>

  <a class="btn btn-outline-dark mt-4" href="../../index.html">Back to Home</a>
</main>

<footer class="site-footer bg-dark text-white text-center">
  <small>© 2026 IT by Gilvey Nikolay</small>
</footer>

<script src="../../click.js"></script>
<script>
  function coin() {
    return Math.random() < 0.5;
  }

  function yesNo(value) {
    return value ? "YES" : "NO";
  }

  document.getElementById("run").addEventListener("click", function () {
    const admitA = coin();
    const admitB = coin();
    const betrayA = coin();
    const betrayB = coin();

    document.getElementById("decisions").innerHTML =
      "<strong>Person A</strong><br>Admits guilt: " + yesNo(admitA)
      + "<br><br><strong>Person B</strong><br>Admits guilt: " + yesNo(admitB);
    document.getElementById("betrayal").innerHTML =
      "<strong>Person A</strong><br>Betrays partner: " + yesNo(betrayA)
      + "<br><br><strong>Person B</strong><br>Betrays partner: " + yesNo(betrayB);

    let message = "Both remained silent.";
    if (betrayA && betrayB) message = "Both criminals betrayed the partner.";
    else if (betrayA || betrayB) message = "One criminal betrayed the partner.";
    else if (admitA && admitB) message = "Both admitted guilt.";
    else if (admitA || admitB) message = "Only one admitted guilt.";

    const out = document.getElementById("result");
    out.textContent = message;
    out.className = "result";
  });
</script>
</body>
</html>
