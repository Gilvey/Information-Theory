<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 2 — Boolean logic — IT by Gilvey Nikolay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../site.css">
</head>
<body data-meow="../../meow.mp3">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="../../index.html">IT by Gilvey Nikolay</a>
    <a class="btn btn-outline-light" href="../../index.html">Home</a>
  </div>
</nav>

<main class="container project-page text-center">
  <h1>Project 2</h1>
  <p class="project-note">Boolean logic</p>

  <div class="card shadow-sm work-card">
    <div class="card-body">
      <div class="d-flex justify-content-center align-items-center flex-wrap">
        <input id="left" class="form-control text-center mx-1" style="width: 90px;" inputmode="numeric" aria-label="First number">
        <input id="right" class="form-control text-center mx-1" style="width: 90px;" inputmode="numeric" aria-label="Second number">
        <button id="logic" type="button" class="btn btn-primary ml-2">=</button>
      </div>
      <p id="logic-result" class="result mt-3 mb-0"></p>

      <hr class="my-4">

      <p class="project-note mb-2">Seven bits. Index is their parity.</p>
      <div class="d-flex justify-content-center flex-wrap mb-3">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 1">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 2">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 3">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 4">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 5">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 6">
        <input class="form-control bit mx-1 mb-2" maxlength="1" inputmode="numeric" aria-label="Bit 7">
      </div>
      <button id="index" type="button" class="btn btn-primary">Index</button>
      <p id="index-result" class="result mt-3 mb-0"></p>
    </div>
  </div>

  <a class="btn btn-outline-dark mt-4" href="../../index.html">Back to Home</a>
</main>

<footer class="site-footer bg-dark text-white text-center">
  <small>© 2026 IT by Gilvey Nikolay</small>
</footer>

<script src="../../click.js"></script>
<script>
  document.getElementById("logic").addEventListener("click", function () {
    const left = Number(document.getElementById("left").value);
    const right = Number(document.getElementById("right").value);
    const out = document.getElementById("logic-result");
    if (!Number.isInteger(left) || !Number.isInteger(right)) {
      out.textContent = "Enter integers";
      out.className = "result result-bad";
      return;
    }
    out.className = "result";
    out.innerHTML = left + " &amp; " + right + " = " + (left & right) + "<br>"
      + left + " | " + right + " = " + (left | right) + "<br>"
      + left + " ^ " + right + " = " + (left ^ right);
  });

  document.getElementById("index").addEventListener("click", function () {
    const bits = Array.from(document.querySelectorAll(".bit"));
    const out = document.getElementById("index-result");
    if (bits.some(function (box) { return box.value !== "0" && box.value !== "1"; })) {
      out.textContent = "Each box needs 0 or 1";
      out.className = "result result-bad";
      return;
    }
    const parity = bits.reduce(function (sum, box) { return sum + Number(box.value); }, 0) % 2;
    out.textContent = String(parity);
    out.className = "result";
  });
</script>
</body>
</html>
