<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project 4 — Information measures — IT by Gilvey Nikolay</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../site.css">
  <style>
    h1 { font-size: 3.5rem; }
    h2 { font-size: 1.75rem; }
  </style>
</head>
<body data-meow="../../meow.mp3">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="../../index.html">IT by Gilvey Nikolay</a>
    <a class="btn btn-outline-light" href="../../index.html">Home</a>
  </div>
</nav>

<main class="container project-page text-center">
  <h1>Project 4</h1>
  <p class="project-note">LB(N) and Shannon entropy</p>

  <div class="card shadow-sm work-card">
    <div class="card-body">
      <h2>Binary algorithm</h2>
      <p class="formula">H = K · LB(N)</p>
      <p class="project-note">LB(N) is the base-2 logarithm of the number of symbol sequences.</p>
      <div class="d-flex justify-content-center align-items-center flex-wrap">
        <span class="mr-2">LB(</span>
        <input id="count" class="form-control text-center mx-1" style="width: 90px;" inputmode="decimal" aria-label="N">
        <span class="mr-2">)</span>
        <button id="log" type="button" class="btn btn-primary">=</button>
      </div>
      <p id="log-result" class="result mt-3 mb-0"></p>
    </div>
  </div>

  <div class="card shadow-sm work-card">
    <div class="card-body">
      <h2>Shannon entropy</h2>
      <img class="entropy-img mb-3" src="../../assets/shannon-formula.jpg" alt="S(x) equals the sum of p(i) times log base 2 of 1 over p(i)">
      <div class="d-flex justify-content-center flex-wrap mb-3">
        <input id="p1" class="form-control text-center m-1" style="width: 84px;" value="50" inputmode="decimal" aria-label="p1 percent">
        <input id="p2" class="form-control text-center m-1" style="width: 84px;" value="25" inputmode="decimal" aria-label="p2 percent">
        <input id="p3" class="form-control text-center m-1" style="width: 84px;" value="12.5" inputmode="decimal" aria-label="p3 percent">
        <input id="p4" class="form-control text-center m-1" style="width: 84px;" value="12.5" inputmode="decimal" aria-label="p4 percent">
      </div>
      <button id="entropy" type="button" class="btn btn-primary">S(x) =</button>
      <p id="entropy-result" class="result mt-3 mb-4"></p>
      <img class="entropy-img" src="../../assets/shannon-example.jpg" alt="Worked Shannon entropy example">
    </div>
  </div>

  <a class="btn btn-outline-dark mt-4" href="../../index.html">Back to Home</a>
</main>

<footer class="site-footer bg-dark text-white text-center">
  <small>© 2026 IT by Gilvey Nikolay</small>
</footer>

<script src="../../click.js"></script>
<script>
  function show(id, text, bad) {
    const out = document.getElementById(id);
    out.textContent = text;
    out.className = bad ? "result result-bad" : "result";
  }

  function pretty(value) {
    const rounded = Math.round(value * 1000000) / 1000000;
    return String(rounded);
  }

  document.getElementById("log").addEventListener("click", function () {
    const n = Number(document.getElementById("count").value);
    if (!(n > 0)) {
      show("log-result", "N must be greater than 0", true);
      return;
    }
    show("log-result", pretty(Math.log2(n)), false);
  });

  document.getElementById("entropy").addEventListener("click", function () {
    const parts = ["p1", "p2", "p3", "p4"].map(function (id) {
      return Number(document.getElementById(id).value);
    });
    if (parts.some(function (value) { return Number.isNaN(value) || value < 0; })) {
      show("entropy-result", "Enter percentages from 0 upward", true);
      return;
    }
    let total = 0;
    parts.forEach(function (percent) {
      if (percent === 0) return;
      const p = percent / 100;
      total += p * Math.log2(1 / p);
    });
    show("entropy-result", pretty(total), false);
  });
</script>
</body>
</html>
